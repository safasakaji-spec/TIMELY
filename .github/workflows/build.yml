name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: 'stable'

      - name: Generate Android Project Files
        run: flutter create . --platforms=android --org com.school.app --project-name school_tardiness_app

      - name: Customize App Name and Icon
        run: |
          # 1. تغيير اسم التطبيق ليظهر بـ Timely
          sed -i 's/android:label="school_tardiness_app"/android:label="Timely"/g' android/app/src/main/AndroidManifest.xml
          
          # 2. تثبيت مكتبة Pillow
          pip install Pillow
          
          # 3. رسم أيقونة جرس بتناسق الزهري والأخضر المريمي
          python3 -c "
          import os
          from PIL import Image, ImageDraw

          bg_color = (247, 224, 227)   # خلفية زهري ناعم
          bell_color = (78, 121, 93)   # جرس أخضر مريمي

          icon = Image.new('RGBA', (512, 512), bg_color)
          draw = ImageDraw.Draw(icon)

          # رسم شكل الجرس
          draw.ellipse([236, 110, 276, 150], outline=bell_color, width=16)
          draw.chord([156, 160, 356, 360], start=180, end=360, fill=bell_color)
          draw.rectangle([156, 260, 356, 320], fill=bell_color)
          draw.rounded_rectangle([136, 310, 376, 340], radius=10, fill=bell_color)
          draw.ellipse([231, 335, 281, 375], fill=bell_color)

          res_path = 'android/app/src/main/res'
          sizes = {'mipmap-mdpi': 48, 'mipmap-hdpi': 72, 'mipmap-xhdpi': 96, 'mipmap-xxhdpi': 144, 'mipmap-xxxhdpi': 192}
          for folder, size in sizes.items():
              dir_p = os.path.join(res_path, folder)
              os.makedirs(dir_p, exist_ok=True)
              resized = icon.resize((size, size), Image.Resampling.LANCZOS)
              resized.save(os.path.join(dir_p, 'ic_launcher.png'), 'PNG')
          "

      - name: Install Dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Timely-App
          path: build/app/outputs/flutter-apk/app-release.apk
